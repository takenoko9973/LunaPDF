services:
    workspace:
        image: lunapdf_devcontainer-workspace:latest
        build:
            context: .
            dockerfile: Dockerfile
        init: true
        working_dir: /workspace
        command: /bin/sh -c "while sleep 1000; do :; done"
        volumes:
            - ..:/workspace
            - cargo-target:/workspace/target
            - cargo-registry:/usr/local/cargo/registry
        tty: true

volumes:
    cargo-target:
    cargo-registry:
        # 既存 volume の実名を使い、Compose project が違ってもダウンロードを再利用する。
        name: lunapdf_devcontainer_cargo-registry
